# A generic, single database configuration.

[alembic]

# path to migration scripts
script_location = %(here)s/alembic

# add project root to sys.path
prepend_sys_path = .

# timezone (optional)
# timezone =

# path separator
path_separator = os

# 🔥 IMPORTANT: YOUR DATABASE URL (UPDATED)
sqlalchemy.url = sqlite:///./phoenix.db


[post_write_hooks]
# (optional hooks - leave as is)


# -----------------------------
# LOGGING CONFIGURATION
# -----------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S